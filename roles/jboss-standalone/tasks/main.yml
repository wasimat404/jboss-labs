---
- name: Install Java (Ubuntu)
  apt:
    name: openjdk-11-jdk
    state: present
    update_cache: yes
  become: yes

- name: Create wildfly group
  group:
    name: wildfly
  become: yes

- name: Create wildfly user
  user:
    name: wildfly
    group: wildfly
    home: /opt/wildfly
    shell: /usr/sbin/nologin
  become: yes

- name: Download WildFly
  get_url:
    url: https://github.com/wildfly/wildfly/releases/download/26.1.3.Final/wildfly-26.1.3.Final.tar.gz
    dest: /opt/wildfly.tar.gz
  become: yes

- name: Extract WildFly
  unarchive:
    src: /opt/wildfly.tar.gz
    dest: /opt
    remote_src: yes
    creates: /opt/wildfly-26.1.3.Final
  become: yes

- name: Remove existing /opt/wildfly if directory
  file:
    path: /opt/wildfly
    state: absent
  become: yes

- name: Create symlink
  file:
    src: /opt/wildfly-26.1.3.Final
    dest: /opt/wildfly
    state: link
  become: yes

- name: Set ownership on extracted WildFly directory
  file:
    path: /opt/wildfly-26.1.3.Final
    owner: wildfly
    group: wildfly
    recurse: yes
  become: yes

- name: Create systemd service
  copy:
    dest: /etc/systemd/system/wildfly.service
    content: |
      [Unit]
      Description=WildFly Application Server
      After=network.target

      [Service]
      Type=simple
      User=wildfly
      Group=wildfly
      ExecStart=/opt/wildfly/bin/standalone.sh -b 0.0.0.0
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  become: yes

- name: Reload systemd
  systemd:
    daemon_reload: yes
  become: yes

- name: Enable and start WildFly
  systemd:
    name: wildfly
    enabled: yes
    state: started
  become: yes
